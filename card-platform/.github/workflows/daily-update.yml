name: Daily Price Update
on:
  schedule:
    - cron: '0 12 * * *'  # noon UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch HoodCar market data
        env:
          HOODCAR_API_KEY: ${{ secrets.HOODCAR_API_KEY }}
        run: python3 fetch_prices.py --market

      - name: Regenerate sample data with fresh trends
        run: python3 generate_sample_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily price update $(date -u +%Y-%m-%d)"
          git push
