<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Vault — Valuation Intelligence & Liquidation Analytics</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0b0f;--card:#12141d;--border:#1a1d2e;--text:#e2e8f0;--text-muted:#94a3b8;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--gold:#f59e0b;--purple:#a855f7;
  --surface:#161926;
}
html{font-size:15px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.6;min-height:100vh}
a{color:var(--blue);text-decoration:none}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}

.header{padding:28px 24px 18px;text-align:center;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0f1018 0%,var(--bg) 100%)}
.header h1{font-size:2.2rem;font-weight:700;letter-spacing:-.03em;background:linear-gradient(135deg,#fff 0%,var(--green) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .subtitle{color:var(--text-muted);font-size:.78rem;margin-top:4px;letter-spacing:.05em;text-transform:uppercase}

.container{max-width:980px;margin:0 auto;padding:0 20px}

/* Hero Search */
.hero{padding:44px 0 12px;text-align:center}
.search-form{display:flex;gap:10px;max-width:720px;margin:0 auto}
.search-input{flex:1;padding:16px 22px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1.05rem;outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.1)}
.search-input::placeholder{color:#4a5568}
.search-btn{padding:16px 32px;border-radius:14px;border:none;background:var(--green);color:#000;font-weight:700;font-size:1rem;transition:opacity .15s}
.search-btn:hover{opacity:.85}
.search-btn:disabled{opacity:.5;cursor:not-allowed}

/* Spinner */
.spinner{display:inline-block;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.12);border-top-color:var(--green);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{text-align:center;padding:40px 0}
.loading-wrap .spinner{width:32px;height:32px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Result Card */
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-top:24px;text-align:left;animation:fadeIn .3s ease}
.result-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:8px}
.result-query{font-size:.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.result-query span{color:var(--text);font-weight:600}
.result-fv{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.result-right{text-align:right}
.result-badge{display:inline-block;padding:6px 18px;border-radius:8px;font-weight:700;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase}
.badge-LIQUIDATE{background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.badge-HOLD{background:rgba(245,158,11,.12);color:var(--gold);border:1px solid rgba(245,158,11,.25)}
.badge-REVIEW{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.result-sales-count{font-size:.72rem;color:var(--text-muted);margin-top:6px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-label{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.stat-val{font-size:1.1rem;font-weight:600}

.score-bar-wrap{height:6px;background:#1e2030;border-radius:3px;overflow:hidden;margin-top:4px}
.score-bar{height:100%;border-radius:3px;transition:width .5s ease}

.reason-box{color:var(--text-muted);font-size:.86rem;line-height:1.5;padding:12px 16px;background:var(--surface);border-radius:10px;border-left:3px solid var(--gold);margin:16px 0}
.reason-box .proceeds{color:var(--green);font-weight:600;margin-top:4px}

/* Grade Ladder */
.grade-section{margin:20px 0 0}
.grade-section-title{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.grade-table{width:100%;border-collapse:collapse;font-size:.85rem}
.grade-table th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-muted);font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.grade-table td{padding:10px 10px;border-bottom:1px solid rgba(26,29,46,.5)}
.grade-table tr:last-child td{border-bottom:none}
.grade-row{cursor:pointer;transition:background .15s}
.grade-row:hover{background:rgba(59,130,246,.06)}
.grade-row.active{background:rgba(34,197,94,.08);border-left:2px solid var(--green)}
.grade-row .grade-name{font-weight:600}
.grade-row .grade-action{color:var(--blue);font-size:.78rem;font-weight:500}
.grade-row .grade-range{color:var(--text-muted);font-size:.78rem}

.grade-detail{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:12px;animation:fadeIn .25s ease}
.grade-detail-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.grade-detail-title{font-size:1rem;font-weight:600}
.grade-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}

/* Category Tabs */
.categories-section{padding:28px 0 0;border-top:1px solid var(--border);margin-top:32px}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.cat-tabs::-webkit-scrollbar{height:3px}
.cat-tabs::-webkit-scrollbar-track{background:transparent}
.cat-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.cat-tab{flex-shrink:0;padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.cat-tab:hover{border-color:#2a2d4e;color:var(--text)}
.cat-tab.active{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.06)}
.cat-tab .cat-count{font-size:.68rem;background:rgba(255,255,255,.06);padding:2px 7px;border-radius:5px;font-weight:600}
.cat-tab.active .cat-count{background:rgba(34,197,94,.15)}

/* Floor Stats */
.floor-section{padding:20px 0 0}
.floor-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.floor-stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;transition:border-color .15s}
.floor-stat-card:hover{border-color:#2a2d4e}
.floor-stat-card .fs-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.floor-stat-card .fs-val{font-size:1.35rem;font-weight:700}

/* Market Movers */
.movers-section{padding:28px 0 32px;border-top:1px solid var(--border);margin-top:24px}
.section-title{font-size:1rem;font-weight:600;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.movers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mover-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color .15s;cursor:pointer}
.mover-card:hover{border-color:#2a2d4e}
.mover-label{font-size:.95rem;font-weight:600;text-transform:capitalize;margin-bottom:4px}
.mover-cat{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.cat-baseball{background:rgba(239,68,68,.12);color:var(--red)}
.cat-basketball{background:rgba(59,130,246,.12);color:var(--blue)}
.cat-football{background:rgba(34,197,94,.12);color:var(--green)}
.cat-soccer{background:rgba(168,85,247,.12);color:var(--purple)}
.cat-pokemon{background:rgba(245,158,11,.12);color:var(--gold)}
.cat-hockey{background:rgba(96,165,250,.12);color:#60a5fa}
.cat-wnba{background:rgba(244,114,182,.12);color:#f472b6}
.cat-default{background:rgba(148,163,184,.1);color:var(--text-muted)}
.mover-price{font-size:1.15rem;font-weight:700;margin-bottom:2px}
.mover-change{font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:4px}
.mover-n{font-size:.7rem;color:var(--text-muted);margin-top:6px}
.movers-empty{text-align:center;padding:32px;color:var(--text-muted);font-size:.88rem}

.error-msg{text-align:center;padding:20px;color:var(--red);background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);border-radius:12px;margin-top:16px;font-size:.88rem}
.no-result{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:.95rem}
.no-result .icon{font-size:2rem;margin-bottom:12px;opacity:.5}

/* Footer */
.footer{border-top:1px solid var(--border);padding:36px 24px;text-align:center;color:var(--text-muted);font-size:.76rem;line-height:2;margin-top:40px}
.footer .coming-soon{color:var(--purple);font-weight:500}

@media(max-width:640px){
  .hero{padding:28px 0 8px}
  .search-form{flex-direction:column}
  .search-btn{width:100%}
  .result-fv{font-size:1.9rem}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .floor-stats{grid-template-columns:repeat(2,1fr)}
  .movers-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
  .header h1{font-size:1.6rem}
  .grade-detail-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:400px){
  .stats-grid{grid-template-columns:1fr}
  .floor-stats{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="header">
  <h1>Card Vault</h1>
  <p class="subtitle">Valuation Intelligence &amp; Liquidation Analytics</p>
</header>

<div class="container">

  <!-- Hero Search -->
  <section class="hero">
    <form class="search-form" id="searchForm">
      <input class="search-input" id="searchInput" type="text" placeholder="Search player, set, year... (e.g. Doncic Prizm 2018)" autocomplete="off" required>
      <button class="search-btn" type="submit" id="searchBtn">Search</button>
    </form>
  </section>

  <!-- Search Results -->
  <div id="searchResult"></div>

  <!-- Category Tabs -->
  <section class="categories-section" id="categoriesSection">
    <div class="cat-tabs" id="catTabs">
      <div class="cat-tab active" data-cat="all">All</div>
    </div>
    <div class="floor-section" id="floorSection" style="display:none"></div>
  </section>

  <!-- Market Movers -->
  <section class="movers-section">
    <div class="section-title"><span class="dot" style="background:var(--green)"></span> Market Movers</div>
    <div id="moversContainer"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </section>

</div>

<footer class="footer">
  <p class="coming-soon">Coming soon: Art (LiveArt API) &middot; Watches (WatchCharts) &middot; Comics (GPAnalysis)</p>
  <p>Every transaction improves future valuations</p>
  <p>Powered by HoodCar Market Data API</p>
</footer>

<script>
(function(){
  const fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:0});
  const fmt2=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtNum=new Intl.NumberFormat('en-US');
  const fmtPct=new Intl.NumberFormat('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});

  function $(id){return document.getElementById(id)}

  const cache={categories:null,floor:{}};
  let allMovers=[];
  let activeCategory='all';
  let currentQuery='';

  /* ── Search ── */
  const form=$('searchForm'),input=$('searchInput'),btn=$('searchBtn'),resultEl=$('searchResult');

  form.addEventListener('submit',function(e){
    e.preventDefault();
    const q=input.value.trim();
    if(!q)return;
    currentQuery=q;
    doSearch(q);
  });

  async function doSearch(q,grade){
    btn.disabled=true;
    resultEl.innerHTML='<div class="loading-wrap"><div class="spinner"></div></div>';
    let url='/api/search?q='+encodeURIComponent(q);
    if(grade)url+='&grade='+encodeURIComponent(grade);
    try{
      const resp=await fetch(url);
      if(!resp.ok)throw new Error('API returned '+resp.status);
      const d=await resp.json();
      if(d.error){resultEl.innerHTML='<div class="error-msg">'+esc(d.error)+'</div>';return;}
      if(d.fair_value==null&&!(d.grade_ladder&&d.grade_ladder.length)){
        resultEl.innerHTML='<div class="no-result"><div class="icon">&#128269;</div>No data found &mdash; this item may need manual appraisal</div>';
        return;
      }
      renderResult(d,grade);
    }catch(err){
      resultEl.innerHTML='<div class="error-msg">Search failed: '+esc(err.message)+'</div>';
    }finally{
      btn.disabled=false;
    }
  }

  function renderResult(d,activeGrade){
    const rec=d.recommendation||{};
    const rating=rec.rating||'REVIEW';
    const scoreColor=scoreClr(d.buy_score);
    const trendColor=(d.trend_30d||0)>=0?'var(--green)':'var(--red)';
    const trendArrow=(d.trend_30d||0)>=0?'&#9650;':'&#9660;';

    let h='<div class="result-card">';

    h+='<div class="result-header"><div>';
    h+='<div class="result-query">Results for <span>\''+esc(d.query||currentQuery)+'\'</span></div>';
    h+='<div class="result-fv">'+(d.fair_value!=null?fmt.format(d.fair_value):'&mdash;')+'</div>';
    h+='</div><div class="result-right">';
    h+='<div class="result-badge badge-'+rating+'">'+rating+'</div>';
    if(d.sample_size!=null)h+='<div class="result-sales-count">'+fmtNum.format(d.sample_size)+' recent sales</div>';
    h+='</div></div>';

    h+='<div class="stats-grid">';
    h+=statBox('Fair Value',d.fair_value!=null?fmt.format(d.fair_value):'—');
    h+=statBox('Avg Price',d.avg_price!=null?fmt.format(d.avg_price):'—');
    h+=buyScoreBox(d.buy_score,scoreColor);
    h+=statBox('90-Day Sales',d.sales_90d!=null?fmtNum.format(d.sales_90d):'—');
    h+=statBox('30-Day Trend',d.trend_30d!=null?'<span style="color:'+trendColor+'">'+trendArrow+' '+fmtPct.format(Math.abs(d.trend_30d))+'%</span>':'—');
    h+=statBox('Liquidity',d.liquidity!=null?d.liquidity+'%':'—');
    h+='</div>';

    if(rec.reason||rec.est_net_proceeds!=null){
      const borderClr=rating==='LIQUIDATE'?'var(--green)':rating==='HOLD'?'var(--gold)':'var(--blue)';
      h+='<div class="reason-box" style="border-left-color:'+borderClr+'">';
      if(rec.reason)h+=esc(rec.reason);
      if(rec.est_net_proceeds!=null)h+='<div class="proceeds">Est. Net Proceeds: '+fmt.format(rec.est_net_proceeds)+'</div>';
      h+='</div>';
    }

    if(d.grade_ladder&&d.grade_ladder.length){
      h+='<div class="grade-section">';
      h+='<div class="grade-section-title">Grade Ladder &mdash; click a grade to drill down</div>';
      h+='<table class="grade-table"><thead><tr><th>Grade</th><th>Fair Value</th><th>Low</th><th>High</th><th>Sales</th><th></th></tr></thead><tbody>';
      d.grade_ladder.forEach(function(g){
        const isActive=activeGrade&&g.grade===activeGrade;
        h+='<tr class="grade-row'+(isActive?' active':'')+'" data-grade="'+esc(g.grade)+'">';
        h+='<td class="grade-name">'+esc(g.grade)+'</td>';
        h+='<td>'+(g.value!=null?fmt.format(g.value):'—')+'</td>';
        h+='<td class="grade-range">'+(g.low!=null?fmt.format(g.low):'—')+'</td>';
        h+='<td class="grade-range">'+(g.high!=null?fmt.format(g.high):'—')+'</td>';
        h+='<td>'+(g.sample_size!=null?fmtNum.format(g.sample_size):'—')+'</td>';
        h+='<td class="grade-action">'+(isActive?'&#10003; Selected':'Select &rarr;')+'</td>';
        h+='</tr>';
      });
      h+='</tbody></table></div>';
    }

    if(activeGrade&&d.recommendation){
      h+='<div class="grade-detail">';
      h+='<div class="grade-detail-header"><div class="grade-detail-title">'+esc(activeGrade)+' Detail</div>';
      h+='<div class="result-badge badge-'+(rec.rating||'REVIEW')+'">'+(rec.rating||'REVIEW')+'</div></div>';
      h+='<div class="grade-detail-grid">';
      h+=statBox('Fair Value',d.fair_value!=null?fmt.format(d.fair_value):'—');
      h+=statBox('Confidence',d.confidence!=null?d.confidence+'%':'—');
      h+=statBox('Est. Proceeds',rec.est_net_proceeds!=null?fmt.format(rec.est_net_proceeds):'—','var(--green)');
      h+=statBox('Last Sale',d.last_sale!=null?fmt.format(d.last_sale):'—');
      h+='</div></div>';
    }

    h+='</div>';
    resultEl.innerHTML=h;

    resultEl.querySelectorAll('.grade-row').forEach(function(row){
      row.addEventListener('click',function(){
        const grade=this.getAttribute('data-grade');
        doSearch(currentQuery,grade);
      });
    });
  }

  function statBox(label,val,color){
    return '<div class="stat-box"><div class="stat-label">'+esc(label)+'</div><div class="stat-val"'+(color?' style="color:'+color+'"':'')+'>'+val+'</div></div>';
  }

  function buyScoreBox(score,color){
    if(score==null)return statBox('Buy Score','—');
    return '<div class="stat-box"><div class="stat-label">Buy Score</div><div class="stat-val" style="color:'+color+'">'+score+' / 100</div>'
      +'<div class="score-bar-wrap"><div class="score-bar" style="width:'+Math.min(score,100)+'%;background:'+color+'"></div></div></div>';
  }

  function scoreClr(s){return s>=70?'var(--green)':s>=40?'var(--gold)':'var(--red)'}

  /* ── Categories ── */
  async function loadCategories(){
    try{
      const resp=await fetch('/api/categories');
      if(!resp.ok)throw new Error('Status '+resp.status);
      const d=await resp.json();
      cache.categories=d.categories||[];
      renderCatTabs();
    }catch(e){
      $('catTabs').innerHTML='<div style="color:var(--text-muted);font-size:.82rem;padding:8px">Could not load categories</div>';
    }
  }

  function renderCatTabs(){
    const cats=cache.categories||[];
    let h='<div class="cat-tab'+(activeCategory==='all'?' active':'')+'" data-cat="all">All</div>';
    cats.forEach(function(c){
      const name=capitalize(c.category);
      const active=activeCategory===c.category?' active':'';
      h+='<div class="cat-tab'+active+'" data-cat="'+esc(c.category)+'">';
      h+=esc(name);
      if(c.listings!=null)h+='<span class="cat-count">'+fmtNum.format(c.listings)+'</span>';
      h+='</div>';
    });
    $('catTabs').innerHTML=h;

    $('catTabs').querySelectorAll('.cat-tab').forEach(function(tab){
      tab.addEventListener('click',function(){
        const cat=this.getAttribute('data-cat');
        setActiveCategory(cat);
      });
    });
  }

  function setActiveCategory(cat){
    activeCategory=cat;
    $('catTabs').querySelectorAll('.cat-tab').forEach(function(t){
      t.classList.toggle('active',t.getAttribute('data-cat')===cat);
    });
    filterMovers();
    if(cat==='all'){
      $('floorSection').style.display='none';
    }else{
      loadFloor(cat);
    }
  }

  /* ── Floor ── */
  async function loadFloor(cat){
    const section=$('floorSection');
    section.style.display='block';
    section.innerHTML='<div class="loading-wrap"><div class="spinner"></div></div>';

    if(cache.floor[cat]){
      renderFloor(cache.floor[cat],cat);
      return;
    }

    try{
      const resp=await fetch('/api/floor?category='+encodeURIComponent(cat));
      if(!resp.ok)throw new Error('Status '+resp.status);
      const d=await resp.json();
      const info=(d.categories&&d.categories.length)?d.categories[0]:d;
      cache.floor[cat]=info;
      renderFloor(info,cat);
    }catch(e){
      section.innerHTML='<div class="error-msg" style="font-size:.82rem">Could not load floor data</div>';
    }
  }

  function renderFloor(d,cat){
    const section=$('floorSection');
    let h='<div style="margin-bottom:6px;font-size:.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">'+capitalize(cat)+' Floor Stats</div>';
    h+='<div class="floor-stats">';
    h+=floorCard('Total Listings',d.listings!=null?fmtNum.format(d.listings):'—');
    h+=floorCard('Total Market Value',d.total_value!=null?fmt.format(d.total_value):'—','var(--green)');
    h+=floorCard('Average Price',d.avg!=null?fmt.format(d.avg):'—');
    h+=floorCard('Median Price',d.median!=null?fmt.format(d.median):'—');
    h+='</div>';
    section.innerHTML=h;
  }

  function floorCard(label,val,color){
    return '<div class="floor-stat-card"><div class="fs-label">'+esc(label)+'</div><div class="fs-val"'+(color?' style="color:'+color+'"':'')+'>'+val+'</div></div>';
  }

  /* ── Market Movers ── */
  async function loadMovers(){
    const el=$('moversContainer');
    try{
      const resp=await fetch('/api/movers');
      if(!resp.ok)throw new Error('Status '+resp.status);
      const d=await resp.json();
      allMovers=d.movers||d;
      if(!Array.isArray(allMovers))allMovers=[];
      filterMovers();
    }catch(err){
      el.innerHTML='<div class="error-msg" style="font-size:.82rem">Could not load movers: '+esc(err.message)+'</div>';
    }
  }

  function filterMovers(){
    const el=$('moversContainer');
    const filtered=activeCategory==='all'?allMovers:allMovers.filter(function(m){return m.category===activeCategory});
    if(!filtered.length){
      el.innerHTML='<div class="movers-empty">No movers'+(activeCategory!=='all'?' in '+capitalize(activeCategory):'')+'</div>';
      return;
    }
    let h='<div class="movers-grid">';
    filtered.forEach(function(m){
      const up=m.direction==='up'||(m.pct_change||0)>0;
      const color=up?'var(--green)':'var(--red)';
      const arrow=up?'&#9650;':'&#9660;';
      const catClass='cat-'+(m.category||'default');
      h+='<div class="mover-card" data-label="'+esc(m.label||'')+'">';
      h+='<div class="mover-label">'+esc(m.label||'')+'</div>';
      h+='<div class="mover-cat '+catClass+'">'+esc(m.category||'')+'</div>';
      h+='<div class="mover-price">'+(m.current_avg!=null?fmt.format(m.current_avg):'—')+'</div>';
      h+='<div class="mover-change" style="color:'+color+'">'+arrow+' '+fmtPct.format(Math.abs(m.pct_change||0))+'%</div>';
      if(m.n!=null)h+='<div class="mover-n">'+fmtNum.format(m.n)+' listings</div>';
      h+='</div>';
    });
    h+='</div>';
    el.innerHTML=h;

    el.querySelectorAll('.mover-card').forEach(function(card){
      card.addEventListener('click',function(){
        const label=this.getAttribute('data-label');
        if(label){
          input.value=label;
          currentQuery=label;
          doSearch(label);
          window.scrollTo({top:0,behavior:'smooth'});
        }
      });
    });
  }

  /* ── Utils ── */
  function esc(s){var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
  function capitalize(s){if(!s)return '';return s.charAt(0).toUpperCase()+s.slice(1)}

  /* ── Init ── */
  loadCategories();
  loadMovers();
})();
</script>
</body>
</html>
